{% set name = "isotomics" %}
{% set version = "0.2.1" %}

package:
  name: {{ name }}
  version: {{ version }}

# Built from the PyPI sdist. After uploading a release to PyPI, update `version`
# above and paste the sdist's sha256 from https://pypi.org/project/isotomics/#files
source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: FILL_IN_AFTER_PYPI_RELEASE

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - isotomics-quickstart = isotomics.quickstart:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10
    - numpy >=1.23.5,<3
    - pandas >=2.0.0,<4
    - tqdm >=4.0,<5
    - matplotlib-base >=3.10.0,<4
    - seaborn >=0.13.0,<0.14
    - networkx >=3.1,<4
    - sympy >=1.12,<2
    - scipy >=1.14.0,<2

test:
  imports:
    - isotomics
    - isotomics.quickstart

about:
  home: https://github.com/Csernica/isotomics
  dev_url: https://github.com/Csernica/isotomics
  doc_url: https://isotomics.readthedocs.io
  summary: "M+1 data processing and simulation for Orbitrap-IRMS fragmentation experiments"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - csernica
