[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isotomics"
version = "0.2.4"
description = "M+1 data processing and simulation for Orbitrap-IRMS fragmentation experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Timothy Csernica" },
  { name = "Sarah S. Zeichner" },
]
keywords = ["isotopologues", "isotope", "Orbitrap", "M+1", "IRMS"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.23.5,<3",
  "pandas>=2.0.0,<4",
  "tqdm>=4.0,<5",
  "matplotlib>=3.10.0,<4",
  "seaborn>=0.13.0,<0.14",
  "networkx>=3.1,<4",
  "sympy>=1.12,<2",
  "scipy>=1.14.0,<2",
]

[project.urls]
Homepage = "https://github.com/Csernica/isotomics"
Documentation = "https://isotomics.readthedocs.io"
Source = "https://github.com/Csernica/isotomics"
Issues = "https://github.com/Csernica/isotomics/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
docs = [
  "sphinx>=7.0",
  "myst-nb>=1.1",
]

[project.scripts]
isotomics-quickstart = "isotomics.quickstart:main"

[tool.setuptools]
include-package-data = true

# Find isotomics and its data folders (input_data/...), so their files ship with the package
[tool.setuptools.packages.find]
include = ["isotomics*"]

[tool.setuptools.package-data]
isotomics = ["input_data/**"]

